<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Powtórka · Notatki z chińskiego</title>
<style>
  :root {
    --bg: #f6f1e8; --card: #fffdf8; --ink: #1f1a14; --muted: #7a6f62;
    --accent: #b8362d; --accent-soft: #f3d9d5; --line: #e6dccd; --star: #d99a1c;
    --ok-bg: #dff3e3; --ok-ink: #14532d; --mid-bg: #fdf0d5; --mid-ink: #7c4a03;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171412; --card: #221e1a; --ink: #f1e9dd; --muted: #a2968a;
            --accent: #e0574c; --accent-soft: #3a2320; --line: #332c26; --star: #f0c04a;
            --ok-bg: #14351f; --ok-ink: #9be2b0; --mid-bg: #3a2c10; --mid-ink: #f0c674; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
  header { padding: 14px 18px 8px; max-width: 620px; width: 100%; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .prog { flex: 1; text-align: center; font-size: 14px; color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; width: 100%; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  select, button, input { font: inherit; }
  select { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .gear { background: none; border: none; font-size: 18px; cursor: pointer; padding: 2px 4px; }
  main { flex: 1; max-width: 620px; width: 100%; margin: 0 auto; padding: 10px 18px 24px; display: flex; flex-direction: column; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; flex: 1; position: relative;
          display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 14px; text-align: center; min-height: 340px; }
  /* nic nad mikrofonem ani sam mikrofon nie może się ruszać, gdy wynik się zmienia: karta od góry, stała szerokość przycisku, zarezerwowane miejsce na wynik */
  .star { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 26px; cursor: pointer; color: var(--muted); padding: 4px 6px; line-height: 1; }
  .star.on { color: var(--star); }
  .tag { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .q { font-size: 30px; font-weight: 600; line-height: 1.25; }
  .q small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 6px; }
  .hanzi { font-size: 40px; line-height: 1.2; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .pinyin { font-size: 19px; color: var(--accent); }
  .pl { font-size: 14px; color: var(--muted); }
  .obr { display: block; width: 100%; max-width: 300px; height: 170px; object-fit: cover; border-radius: 12px; background: var(--line); }
  .kred { font-size: 11px; color: var(--muted); }
  .kred a { color: inherit; }
  .big { font-size: 64px; background: none; border: none; cursor: pointer; line-height: 1; }
  .big:active { transform: scale(.94); }
  .mic { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; padding: 14px 22px; border-radius: 999px; min-width: 250px; box-sizing: border-box;
         border: 2px solid var(--accent); background: transparent; color: var(--ink); cursor: pointer;
         touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .mic.rec { background: var(--accent); color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  .link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 6px; }
  .result { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--bg); line-height: 1.4; width: 100%; box-sizing: border-box; min-height: 42px; }
  .result:empty { background: transparent; padding: 0; }
  .wym { min-height: 30px; line-height: 30px; font-size: 24px; font-weight: 600; color: var(--accent); }   /* polski zapis nad guzikiem; miejsce zarezerwowane od początku */
  .dosl { font-size: 12px; line-height: 1.35; color: var(--muted); }   /* znaczenie słowo po słowie */
  .wym + .dosl { margin-top: -12px; }
  .dosl.ukryte { visibility: hidden; }
  .result.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .result.mid { background: var(--mid-bg); color: var(--mid-ink); }
  .result.bad { background: var(--accent-soft); color: var(--accent); }
  .opts { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .opt { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; text-align: left; font-size: 16px; }
  .opt:active { transform: scale(.98); }
  .opt.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }
  .opt.bad { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .opt:disabled { cursor: default; }
  .typed { display: flex; gap: 8px; width: 100%; }
  .typed input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 16px; }
  .typed button { padding: 12px 16px; border-radius: 12px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
  .reveal { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; border-top: 1px dashed var(--line); width: 100%; }
  .rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .rate button { padding: 12px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-size: 14px; line-height: 1.2; }
  .rate button small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .rate button.sug { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .rate button:active { transform: scale(.96); }
  .start { padding: 16px 28px; border-radius: 999px; border: none; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; }
  .sum { font-size: 15px; color: var(--muted); line-height: 1.6; }
  .hint { color: var(--muted); font-size: 13px; }
  .sync { font-size: 12px; color: var(--muted); text-align: center; padding: 6px 0 0; }
  .sync.err { color: var(--accent); }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); padding: 18px; max-width: 360px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog label { display: block; margin: 10px 0 4px; font-size: 14px; }
  dialog select { width: 100%; }
  dialog input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  dialog button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  dialog button.p { background: var(--accent); color: #fff; border-color: var(--accent); }
  .diag { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .diag pre { max-height: 200px; overflow: auto; font-size: 11px; white-space: pre-wrap; word-break: break-all; background: var(--card); padding: 8px; border-radius: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <a href="../">← lekcje</a>
  <span class="prog" id="prog">Powtórka</span>
  <a href="../ulubione/" title="Ulubione zwroty">★</a>
  <select id="filtr"><option value="">wszystkie lekcje</option></select>
  <button class="gear" id="gear" type="button" title="Ustawienia">⚙</button>
  <div class="bar"><i id="bar"></i></div>
</header>

<main>
  <div class="card" id="card"></div>
  <div class="rate" id="rate" hidden>
    <button type="button" data-q="0">nie wiem<small>dziś jeszcze raz</small></button>
    <button type="button" data-q="1">trudno<small id="d1"></small></button>
    <button type="button" data-q="2">dobrze<small id="d2"></small></button>
    <button type="button" data-q="3">łatwo<small id="d3"></small></button>
  </div>
  <div class="sync" id="sync"></div>
  <details class="diag"><summary>diagnostyka mikrofonu</summary><pre id="diag-log"></pre></details>
</main>

<dialog id="dlg">
  <b>Ustawienia</b>
  <label>Nowych kart dziennie <input type="number" id="s-nowe" min="0" max="100"></label>
  <label>Adres synchronizacji <input type="url" id="s-url" placeholder="https://….workers.dev"></label>
  <label>Klucz synchronizacji <input type="text" id="s-klucz" autocomplete="off"></label>
  <label>Rozpoznawanie mowy
    <select id="s-silnik">
      <option value="auto">automatycznie (system)</option>
      <option value="chmura">chmura (Whisper przez worker)</option>
      <option value="system">system (Web Speech: Google / Apple)</option>
      <option value="system-reload">system + przeładowanie strony po każdym użyciu (iOS)</option>
    </select>
  </label>
  <p class="hint">Postęp zapisuje się w tej przeglądarce i, jeśli podasz adres i klucz, w chmurze (wspólny dla wszystkich urządzeń).</p>
  <div class="row"><button type="button" id="s-anuluj">Anuluj</button><button type="button" class="p" id="s-ok">Zapisz</button></div>
</dialog>

if (paramK) { cfg.klucz = paramK; zapiszCfg(); history.replaceState(null, "", location.pathname); Wymowa.diag("klucz z linku zapisany, silnik: " + Wymowa.cfg().uzyj); }
function zapiszCfg() { try { localStorage.setItem(KLUCZ_LS + ".sync", JSON.stringify(cfg)); } catch (e) {} }

function scal(a, b) {
  // nowsza wersja karty wygrywa (pole z = czas zmiany); to samo w workerze
  const out = { karty: Object.assign({}, a.karty), ustawienia: a.ustawienia, dzien: a.dzien, ulubione: Object.assign({}, a.ulubione || {}) };
  for (const k in (b.karty || {})) { const x = out.karty[k], y = b.karty[k]; if (!x || (y.z || 0) > (x.z || 0)) out.karty[k] = y; }
  for (const k in (b.ulubione || {})) { const x = out.ulubione[k], y = b.ulubione[k]; if (!x || (y.z || 0) > (x.z || 0)) out.ulubione[k] = y; }
  if (b.ustawienia && (b.ustawienia.z || 0) > (a.ustawienia.z || 0)) out.ustawienia = b.ustawienia;
  if (b.dzien && b.dzien.data > (a.dzien.data || "")) out.dzien = b.dzien;
  else if (b.dzien && b.dzien.data === a.dzien.data) out.dzien = { data: a.dzien.data, nowe: Math.max(a.dzien.nowe || 0, b.dzien.nowe || 0), hsk: Math.max(a.dzien.hsk || 0, b.dzien.hsk || 0) };
  return out;
}
function zapiszLokalnie() { try { localStorage.setItem(KLUCZ_LS, JSON.stringify(stan)); } catch (e) {} }

let syncTimer = null, syncBusy = false, syncDirty = false;
function pokazSync(msg, err) { const el = $("sync"); el.textContent = msg; el.className = "sync" + (err ? " err" : ""); }
async function syncTeraz(pobierzTylko) {
  if (!cfg.url || !cfg.klucz) { pokazSync("bez synchronizacji (ustaw adres i klucz w ⚙)"); return; }
  if (syncBusy) { syncDirty = true; return; }
  syncBusy = true;
  try {
    const r = await fetch(cfg.url.replace(/\/$/, "") + "/stan", {
      method: pobierzTylko ? "GET" : "PUT",
      headers: { "Authorization": "Bearer " + cfg.klucz, "Content-Type": "application/json" },
      body: pobierzTylko ? undefined : JSON.stringify(stan)
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const zdalny = await r.json();
    stan = scal(stan, zdalny); zapiszLokalnie();
    pokazSync("zsynchronizowano " + new Date().toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" }));
  } catch (e) { pokazSync("synchronizacja nie działa: " + e.message, true); }
  finally { syncBusy = false; if (syncDirty) { syncDirty = false; zaplanujSync(); } }
}
function zaplanujSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncTeraz(false), 3000); }
document.addEventListener("visibilitychange", () => { if (document.hidden && syncTimer) { clearTimeout(syncTimer); syncTeraz(false); } });

// ---------- SM-2 ----------
function dzis() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function dataStr(t) { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function nowyStan() { return { iv: 0, ef: 2.5, termin: 0, reps: 0, seria: 0, z: 0 }; }
function ocen(s, q) {
  // q: 0 nie wiem, 1 trudno, 2 dobrze, 3 łatwo
  s = Object.assign({}, s);
  if (q === 0) { s.reps = 0; s.seria = 0; s.iv = 0; s.ef = Math.max(1.3, s.ef - 0.2); }
  else {
    if (q === 1) { s.iv = s.reps === 0 ? 1 : Math.max(1, Math.round(s.iv * 1.2)); s.ef = Math.max(1.3, s.ef - 0.15); }
    else if (q === 2) { s.iv = s.reps === 0 ? 1 : s.reps === 1 ? 3 : Math.round(s.iv * s.ef); }
    else { s.iv = s.reps === 0 ? 3 : s.reps === 1 ? 5 : Math.round(s.iv * s.ef * 1.3); s.ef = Math.min(3.0, s.ef + 0.15); }
    s.reps++; s.seria++;
  }
  s.termin = dzis() + s.iv * DZIEN;
  s.z = Date.now();
  return s;
}
function podgladIv(s, q) { const n = ocen(s, q); return n.iv === 0 ? "dziś" : n.iv === 1 ? "1 dzień" : n.iv + " dni"; }

const LEKCJE = [...new Map(KARTY.map(k => [k.lekcja, k.lekcjaTytul])).entries()].sort((a, b) => a[0] - b[0]);
for (const [n, t] of LEKCJE) { const o = document.createElement("option"); o.value = n; o.textContent = t; $("filtr").appendChild(o); }

function polskie(k) {
  // "friend · przyjaciel" -> "przyjaciel"; bez nawiasów; warianty po / lub ,
  const m = k.znaczenie.split("·"); return (m.length > 1 ? m.slice(1).join("·") : m[0]).trim();
}
function angielskie(k) { const m = k.znaczenie.split("·"); return m.length > 1 ? m[0].trim() : ""; }
function normalizuj(s) { return s.toLowerCase().replace(/\(.*?\)/g, "").replace(/[^\p{L}\p{N} ]/gu, " ").replace(/\s+/g, " ").trim(); }
function lev(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[a.length][b.length];
}
function pasujePolskie(k, wpis) {
  const w = normalizuj(wpis); if (!w) return false;
  const warianty = polskie(k).split(/[\/,;]/).map(normalizuj).filter(x => x);
  return warianty.some(v => lev(v, w) <= Math.floor(v.length / 4) || (w.length >= 4 && v.split(" ").includes(w)));
}

let kolejka = [], zrobione = 0, razem = 0, biezaca = null, wSesji = false;
function stanKarty(id) { return stan.karty[id] || null; }
function zbudujKolejke(dodatkoweNowe) {
  const f = $("filtr").value;
  const karty = KARTY.filter(k => !f || String(k.lekcja) === f);
  const teraz = dzis() + DZIEN - 1;
  const zalegle = [], nasze = [], hsk = [];
  for (const k of karty) for (const typ of ["B", "A"]) {
    const id = k.id + "|" + typ, s = stanKarty(id);
    if (!s) (k.sciezka ? hsk : nasze).push({ id, k, typ });
    else if (s.termin <= teraz) zalegle.push({ id, k, typ });
  }
  const d = dataStr(dzis());
  if (stan.dzien.data !== d) stan.dzien = { data: d, nowe: 0, hsk: 0 };
  // najpierw nasze (po kolei z lekcji), potem HSK: 5 dziennie + to, czego zabrakło z naszych; HSK losowo, bo kolejne zwroty
  // często powtarzają ten sam schemat (losowanie stałe w ciągu dnia, para B+A jednego zwrotu zostaje razem)
  const limNasze = Math.max(0, stan.ustawienia.nowe - stan.dzien.nowe) + (dodatkoweNowe || 0);
  const wybrane = nasze.slice(0, limNasze);
  const limHsk = Math.max(0, HSK_DZIENNIE + (limNasze - wybrane.length) - (stan.dzien.hsk || 0));
  const poZwrocie = new Map();
  for (const c of hsk) { if (!poZwrocie.has(c.k.id)) poZwrocie.set(c.k.id, []); poZwrocie.get(c.k.id).push(c); }
  const grupy = [...poZwrocie.values()];
  let ziarno = [...d].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const los = () => ((ziarno = (ziarno * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = grupy.length - 1; i > 0; i--) { const j = Math.floor(los() * (i + 1)); [grupy[i], grupy[j]] = [grupy[j], grupy[i]]; }
  const nowe = wybrane.concat(grupy.flat().slice(0, limHsk)), limit = nowe.length;
  for (let i = zalegle.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [zalegle[i], zalegle[j]] = [zalegle[j], zalegle[i]]; }
  // nowe słówka rozłożone równomiernie między zaległe (nie na końcu); para B+A jednego słówka zostaje razem
  const paczki = [];
  for (const c of nowe.slice(0, limit)) { const p = paczki[paczki.length - 1]; if (p && p[0].k === c.k) p.push(c); else paczki.push([c]); }
  const razemPoz = zalegle.length + paczki.length;
  kolejka = [];
  for (let i = 0, zi = 0, pi = 0; i < razemPoz; i++) {
    if (pi < paczki.length && (zi >= zalegle.length || (i + 1) * paczki.length > pi * razemPoz)) kolejka.push(...paczki[pi++]);
    else kolejka.push(zalegle[zi++]);
  }
  zrobione = 0; razem = kolejka.length;
  pokazPostep();
}
function pokazPostep() {
  $("prog").textContent = razem ? `${zrobione} / ${razem}` : "Powtórka";
  $("bar").style.width = razem ? (100 * zrobione / razem) + "%" : "0";
}

// ---------- ulubione (gwiazdka na karcie; lista na stronie ../ulubione/) ----------
function ulubiona(znaki) { const u = stan.ulubione[znaki]; return !!(u && u.on); }
function przelaczUlubiona(znaki) { stan.ulubione[znaki] = { on: !ulubiona(znaki), z: Date.now() }; zapiszLokalnie(); zaplanujSync(); }
function gwiazdka(k) {
  const b = el("button", "star"); b.type = "button";
  const odswiez = () => { const on = ulubiona(k.id); b.textContent = on ? "★" : "☆"; b.classList.toggle("on", on); b.title = on ? "usuń z ulubionych" : "dodaj do ulubionych"; };
  odswiez(); b.addEventListener("click", () => { przelaczUlubiona(k.id); odswiez(); });
  return b;
}

let sugestia = 2, odpowiedziano = false;

function nastepna(w) {
  rate.hidden = true; odpowiedziano = false; Wymowa.stopAudio(); widok = null; aktualna = null;
  if (!w) biezaca = kolejka.shift() || null;
  pokazPostep();
  if (!biezaca) { koniec(); return; }
  card.innerHTML = "";
  card.appendChild(gwiazdka(biezaca.k));
  if (biezaca.typ === "A") kartaA(biezaca, w); else kartaB(biezaca, w);
  // nagranie następnej karty do bufora, żeby kolejne odtworzenie było natychmiastowe
  if (kolejka[0] && kolejka[0].k.audio) Wymowa.preload("../" + kolejka[0].k.audio + ".mp3").catch(() => {});
  if (kolejka[0] && kolejka[0].k.img) { const i = new Image(); i.src = "../" + kolejka[0].k.img; }
}

function obrazek(k) { const i = el("img", "obr"); i.src = "../" + k.img; i.alt = ""; return i; }
// podpis zdjęcia: wymagany tylko przy CC BY (StockSnap/Rawpixel są CC0)
function kredyt(k) {
  const o = k.obrazek; if (!o || o.licencja !== "by") return null;
  const a = o.autor || "autor nieznany";
  return el("div", "kred", "fot. " + (o.zrodlo ? `<a href="${o.zrodlo}" target="_blank" rel="noopener">${a}</a>` : a) + " · CC BY");
}

// ---- tryb "system-reload": zapis i odtworzenie sesji wokół przeładowania strony ----
Wymowa.zapiszStan = () => ({
  kolejka: kolejka.map(c => c.id), zrobione, razem, biezaca: biezaca ? biezaca.id : null, wSesji, filtr: $("filtr").value, widok
});
function odtworzPoPrzeladowaniu() {
  const w = Wymowa.odbierzWynik();
  if (!w || !w.strona || !w.strona.wSesji || !w.strona.biezaca) return false;
  const st = w.strona;
  const zId = id => { const [znaki, typ] = id.split("|"); const k = KARTY_MAP[znaki]; return k ? { id, k, typ } : null; };
  $("filtr").value = st.filtr || "";
  const b = zId(st.biezaca); if (!b) return false;
  kolejka = st.kolejka.map(zId).filter(x => x); zrobione = st.zrobione; razem = st.razem; wSesji = true;
  biezaca = b;
  nastepna(st.widok);
  if (aktualna && w.res) aktualna.zastosujWynik(w.res);
  requestAnimationFrame(() => window.scrollTo(0, w.scrollY || 0));
  return true;
}

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function odslon(k, kontener, zMikrofonem, onWynik, bezWymowy) {
  const r = el("div", "reveal");
  if (k.img && !card.querySelector(".obr")) r.appendChild(obrazek(k));
  r.appendChild(el("div", "hanzi", k.znaki));
  if (!bezWymowy) {   // karta A ma wymowę już pod guzikiem
    r.appendChild(el("div", "pinyin", k.pinyin));
    if (k.polski) r.appendChild(el("div", "pl", "po polsku: " + k.polski));
    if (k.doslownie) r.appendChild(el("div", "dosl", "dosłownie: " + k.doslownie));
  }
  r.appendChild(el("div", "", polskie(k) + (angielskie(k) ? ` <span class="pl">· ${angielskie(k)}</span>` : "")));
  const kr = kredyt(k); if (kr) r.appendChild(kr);
  const b = el("button", "link", "🔊 posłuchaj"); b.type = "button"; b.addEventListener("click", () => graj(k)); r.appendChild(b);
  const bw = el("button", "link", "🐢 wolniej"); bw.type = "button"; bw.addEventListener("click", () => graj(k, true)); r.appendChild(bw);
  if (zMikrofonem) {
    // ćwiczenie wymowy po odsłonięciu (nie wpływa na ocenę karty)
    const mic = el("button", "mic"); mic.type = "button";
    const out = el("div", "result");
    Wymowa.bind(mic, {
      target: k.znaki,
      audio: () => k.audio ? "../" + k.audio + ".mp3" : "",
      ekran: () => ({ polski: k.polski, pinyin: k.pinyin, znaczenie: polskie(k) }),
      onStart: () => {},
      onDone: onWynik || ((res) => { const x = Wymowa.render(res, k.znaki); out.hidden = false; out.className = "result " + x.cls; out.innerHTML = x.html; })
    });
    r.appendChild(mic); r.appendChild(out);
    kontener.appendChild(r);
    return out;
  }
  kontener.appendChild(r);
  return null;
}

function pokazOcene(sug) {
  const s = stanKarty(biezaca.id) || nowyStan();
  sugestia = sug; odpowiedziano = true;
  for (const b of rate.querySelectorAll("button")) b.classList.toggle("sug", Number(b.dataset.q) === sug);
  $("d1").textContent = podgladIv(s, 1); $("d2").textContent = podgladIv(s, 2); $("d3").textContent = podgladIv(s, 3);
  rate.hidden = false;
}

// Stan widoku bieżącej karty (do odtworzenia po przeładowaniu w trybie "system-reload")
let widok = null, aktualna = null;

// Karta A: polskie znaczenie -> powiedz po chińsku (mikrofon)
function kartaA(c, w) {
  const k = c.k;
  widok = w || { typ: "A", podpowiedzi: 0, skip: false, wynik: null };
  card.appendChild(el("div", "tag", "powiedz po chińsku"));
  if (k.img) card.appendChild(obrazek(k));
  card.appendChild(el("div", "q", polskie(k) + (angielskie(k) ? `<small>${angielskie(k)}</small>` : "")));
  const out = el("div", "result");
  const mic = el("button", "mic"); mic.type = "button";
  const hint = el("button", "link", "podpowiedź"); hint.type = "button";
  // wymowa: tylko polski zapis, NAD guzikiem (prawy kciuk na guziku nie zasłania), po podpowiedzi albo po odsłonięciu
  const wym = el("div", "wym");
  const polskiZapis = () => k.polski || (window.pinyinPro ? pinyinPro.pinyin(k.znaki, { toneType: "none", type: "array" }).map(Wymowa.pinyinPl).join("-") : k.pinyin);
  // znaczenie słowo po słowie tuż pod wymową; tekst jest od początku (niewidoczny), żeby guzik nie skoczył przy odsłonięciu
  const dosl = k.doslownie ? el("div", "dosl ukryte", k.doslownie) : null;
  const pokazWymowe = () => { wym.textContent = polskiZapis(); if (dosl) dosl.classList.remove("ukryte"); };
  const pokazPodpowiedz = (n, zDzwiekiem) => {
    if (n === 1) { pokazWymowe(); hint.textContent = "posłuchaj"; }
    else if (zDzwiekiem) graj(k);
  };
  hint.addEventListener("click", () => { widok.podpowiedzi++; pokazPodpowiedz(widok.podpowiedzi, true); });
  card.appendChild(wym); if (dosl) card.appendChild(dosl); card.appendChild(mic); card.appendChild(out); card.appendChild(hint);
  const rev = el("div"); card.appendChild(rev);
  let odslonieto = false;
  const pokazWynik = (r, sug) => {
    out.hidden = false; out.className = "result " + r.cls; out.innerHTML = r.html;
    if (sug === null) return;
    if (!odslonieto) { odslonieto = true; pokazWymowe(); odslon(k, rev, false, null, true); }
    pokazOcene(sug);
  };
  const zastosujWynik = (res) => {
    const r = Wymowa.render(res, k.znaki);
    const lvl = r.grade ? r.grade.level : "none";
    let sug = null;
    if (lvl !== "none" || res.error) { sug = lvl === "exact" ? 2 : lvl === "tones" ? 1 : 0; if (widok.podpowiedzi && sug > 1) sug = 1; }
    widok.wynik = { cls: r.cls, html: r.html, sug };
    pokazWynik(r, sug);
  };
  Wymowa.bind(mic, {
    target: k.znaki,
    audio: () => k.audio ? "../" + k.audio + ".mp3" : "",
    ekran: () => ({ znaczenie: polskie(k), bezWymowy: true }),   // karta „powiedz po chińsku”: wymowa zdradziłaby odpowiedź
    onStart: () => {},
    onDone: zastosujWynik
  });
  const skip = el("button", "link", "nie pamiętam, pokaż"); skip.type = "button";
  const pokaz = (zDzwiekiem) => { skip.hidden = true; if (!odslonieto) { odslonieto = true; pokazWymowe(); odslon(k, rev, false, null, true); } if (zDzwiekiem) graj(k); pokazOcene(0); };
  skip.addEventListener("click", () => { widok.skip = true; pokaz(true); });
  card.appendChild(skip);
  aktualna = { zastosujWynik };
  // odtworzenie po przeładowaniu
  if (w) {
    if (w.podpowiedzi) pokazPodpowiedz(w.podpowiedzi, false);
    if (w.skip) pokaz(false);
    if (w.wynik) pokazWynik(w.wynik, w.wynik.sug);
  }
}

// Karta B: audio po chińsku -> co to znaczy (wybór, później wpis)
function kartaB(c, w) {
  const k = c.k, s = stanKarty(c.id);
  const etap2 = s && s.seria >= 3 && s.iv >= 7;
  widok = w || { typ: "B", opcje: null, wybor: null, wpis: null, wynikMic: null };
  card.appendChild(el("div", "tag", "co to znaczy?"));
  const big = el("button", "big", "🔊"); big.type = "button"; big.title = "posłuchaj jeszcze raz";
  big.addEventListener("click", () => graj(k));
  card.appendChild(big);
  card.appendChild(el("div", "hint", "posłuchaj i " + (etap2 ? "napisz po polsku" : "wybierz znaczenie")));
  const rev = el("div");
  let revealOut = null;
  const zastosujWynik = (res) => {
    if (!revealOut) return;
    const r = Wymowa.render(res, k.znaki);
    widok.wynikMic = { cls: r.cls, html: r.html };
    revealOut.hidden = false; revealOut.className = "result " + r.cls; revealOut.innerHTML = r.html;
  };
  const odslonB = () => { revealOut = odslon(k, rev, true, zastosujWynik); };
  if (!etap2) {
    let opcje;
    if (w && w.opcje) opcje = w.opcje.map(id => KARTY_MAP[id]).filter(x => x);
    else {
      // dystraktory: ten sam rodzaj (zdanie / słowo), najlepiej z tej samej lekcji
      const zdanie = x => /[。？！?!]/.test(x.znaki);
      const inne = KARTY.filter(x => x.id !== k.id && polskie(x) !== polskie(k));
      const tenRodzaj = inne.filter(x => zdanie(x) === zdanie(k));
      const teSame = tenRodzaj.filter(x => x.lekcja === k.lekcja);
      const pula = teSame.length >= 3 ? teSame : tenRodzaj.length >= 3 ? tenRodzaj : inne;
      const dystr = []; const uzyte = new Set([polskie(k)]);
      while (dystr.length < 3 && pula.length) { const x = pula[Math.floor(Math.random() * pula.length)]; if (!uzyte.has(polskie(x))) { uzyte.add(polskie(x)); dystr.push(x); } if (uzyte.size > pula.length) break; }
      opcje = [k, ...dystr].sort(() => Math.random() - 0.5);
      widok.opcje = opcje.map(x => x.id);
    }
    const box = el("div", "opts");
    const wybierz = (o, b) => {
      if (odpowiedziano) return;
      widok.wybor = o.id;
      for (const bb of box.querySelectorAll("button")) { bb.disabled = true; if (bb === b && o.id !== k.id) bb.classList.add("bad"); if (bb.textContent === polskie(k)) bb.classList.add("ok"); }
      odslonB(); pokazOcene(o.id === k.id ? 2 : 0);
    };
    for (const o of opcje) {
      const b = el("button", "opt", polskie(o)); b.type = "button";
      b.addEventListener("click", () => wybierz(o, b));
      box.appendChild(b);
    }
    card.appendChild(box);
    if (w && w.wybor) { const idx = opcje.findIndex(o => o.id === w.wybor); if (idx >= 0) wybierz(opcje[idx], box.querySelectorAll("button")[idx]); }
  } else {
    const box = el("div", "typed");
    const inp = el("input"); inp.type = "text"; inp.placeholder = "po polsku…"; inp.autocomplete = "off"; inp.autocapitalize = "off";
    const ok = el("button", "", "sprawdź"); ok.type = "button";
    const sprawdz = () => {
      if (odpowiedziano) return;
      widok.wpis = inp.value;
      const trafione = pasujePolskie(k, inp.value);
      inp.disabled = true; ok.disabled = true;
      const out = el("div", "result " + (trafione ? "ok" : "bad"), trafione ? "✓ Tak." : "✗ Nie. Prawidłowo: <b>" + polskie(k) + "</b>");
      card.appendChild(out);
      odslonB(); pokazOcene(trafione ? 2 : 0);
    };
    ok.addEventListener("click", sprawdz); inp.addEventListener("keydown", e => { if (e.key === "Enter") sprawdz(); });
    box.appendChild(inp); box.appendChild(ok); card.appendChild(box);
    if (w && w.wpis !== null) { inp.value = w.wpis; sprawdz(); } else setTimeout(() => inp.focus(), 50);
  }
  card.appendChild(rev);
  aktualna = { zastosujWynik };
  if (w) { if (w.wynikMic && revealOut) { revealOut.hidden = false; revealOut.className = "result " + w.wynikMic.cls; revealOut.innerHTML = w.wynikMic.html; } }
  else graj(k);
}

rate.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || !biezaca || !odpowiedziano) return;
  const q = Number(b.dataset.q);
  const byloNowe = !stanKarty(biezaca.id);
  stan.karty[biezaca.id] = ocen(stanKarty(biezaca.id) || nowyStan(), q);
  if (byloNowe) { if (biezaca.k.sciezka) stan.dzien.hsk = (stan.dzien.hsk || 0) + 1; else stan.dzien.nowe++; }
  if (q === 0) { kolejka.push(biezaca); razem++; }
  zrobione++;
  zapiszLokalnie(); zaplanujSync();
  nastepna();
});

function koniec() {
  wSesji = false;
  card.innerHTML = "";
  const jutro = dzis() + DZIEN, pojutrze = jutro + DZIEN;
  const f = $("filtr").value;
  const naJutro = Object.entries(stan.karty).filter(([id, s]) => s.termin < pojutrze && s.termin >= jutro && (!f || String((KARTY_MAP[id.split("|")[0]] || {}).lekcja) === f)).length;
  const nieRuszone = KARTY.filter(k => (!f || String(k.lekcja) === f) && (!stanKarty(k.id + "|A") || !stanKarty(k.id + "|B"))).length;
  card.appendChild(el("div", "q", razem ? "Koniec na dziś 🎉" : "Nic do powtórki"));
  card.appendChild(el("div", "sum", `Jutro: ${naJutro} kart.<br>Słów jeszcze nie zaczętych: ${nieRuszone}.`));
  if (nieRuszone) {
    const b = el("button", "start", "jeszcze " + Math.min(10, nieRuszone) + " nowych"); b.type = "button";
    b.addEventListener("click", () => { zbudujKolejke(10); wSesji = true; nastepna(); });
    card.appendChild(b);
  }
}

function ekranStartowy() {
  zbudujKolejke();
  card.innerHTML = "";
  card.appendChild(el("div", "q", "Powtórka"));
  card.appendChild(el("div", "sum", razem ? `Na dziś: ${razem} kart.` : "Nic do powtórki na dziś."));
  card.appendChild(el("div", "hint", "Chiński sprawdzasz wymową: przytrzymaj 🎤, poczekaj na „mów teraz”, powiedz, puść.<br>Polski sprawdzasz ze słuchu: wybierasz znaczenie, a gdy karta dojrzeje, wpisujesz je."));
  const b = el("button", "start", razem ? "Start" : "Odśwież"); b.type = "button";
  b.addEventListener("click", () => { zbudujKolejke(); wSesji = true; nastepna(); });
  card.appendChild(b);
}

// ---------- ustawienia ----------
$("gear").addEventListener("click", () => {
  $("s-nowe").value = stan.ustawienia.nowe; $("s-url").value = cfg.url; $("s-klucz").value = cfg.klucz;
  try { $("s-silnik").value = localStorage.getItem("kubus.wymowa.silnik") || "auto"; } catch (e) {}
  $("dlg").showModal();
});
$("s-anuluj").addEventListener("click", () => $("dlg").close());
$("s-ok").addEventListener("click", () => {
  stan.ustawienia = { nowe: Math.max(0, Number($("s-nowe").value) || 0), z: Date.now() };
  cfg.url = $("s-url").value.trim(); cfg.klucz = $("s-klucz").value.trim(); zapiszCfg();
  try { localStorage.setItem("kubus.wymowa.silnik", $("s-silnik").value); } catch (e) {}
  Wymowa.diag("silnik: " + Wymowa.cfg().uzyj + " (ustawienie " + Wymowa.cfg().silnik + ")");
  zapiszLokalnie(); $("dlg").close(); syncTeraz(false).then(() => { if (!wSesji) ekranStartowy(); });
});

if (!odtworzPoPrzeladowaniu()) ekranStartowy();
syncTeraz(true).then(() => { if (!wSesji) ekranStartowy(); });
</script>
</body>
