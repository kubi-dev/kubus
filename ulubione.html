<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ulubione · Notatki z chińskiego</title>
<link rel="stylesheet" href="../lista.css?v={{WERSJA}}">
<style>
  :root { --bg: #f6f1e8; --card: #fffdf8; --ink: #1f1a14; --muted: #7a6f62; --accent: #b8362d; --line: #e6dccd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171412; --card: #221e1a; --ink: #f1e9dd; --muted: #a2968a; --accent: #e0574c; --line: #332c26; } }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
  main { flex: 1; max-width: 620px; width: 100%; margin: 0 auto; padding: 6px 18px 24px; display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<header>
  <a href="../">← lekcje</a>
  <span class="ttl">★ Ulubione</span>
  <a href="../powtorka/">powtórka</a>
</header>

<main>
  <input class="szukaj" id="szukaj" type="search" placeholder="szukaj po polsku…" autocomplete="off" autocapitalize="off">
  <div class="lista" id="lista"></div>
  <div class="sync" id="sync"></div>
  <details class="diag"><summary>diagnostyka mikrofonu</summary><pre id="diag-log"></pre></details>
</main>

<div class="overlay" id="overlay" hidden>
  <header>
    <a href="#" id="wroc">← lista</a>
    <span class="ttl" id="o-ttl"></span>
    <span style="width:60px"></span>
  </header>
  <div class="card" id="card"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<script>window.SYNC_URL = "{{SYNC_URL}}";</script>
<script src="../wymowa.js?v={{WERSJA}}"></script>
<script src="../lista.js?v={{WERSJA}}"></script>
<script>
Lista.start({
  karty: {{KARTY_JSON}}, baza: "../", syncUrl: "{{SYNC_URL}}",
  filtr: k => Lista.ulubiona(k.id), bezZapytania: true,
  pusto: "Nic tu jeszcze nie ma.<br>W <a href=\"../powtorka/\" style=\"color:var(--accent)\">powtórce</a> dotknij ☆ na karcie, żeby dodać zwrot do ulubionych."
});
</script>
</body>
</html>
