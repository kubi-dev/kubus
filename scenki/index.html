<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scenki · Notatki z chińskiego</title>
<style>
  :root { --bg: #f6f1e8; --card: #fffdf8; --ink: #1f1a14; --muted: #7a6f62; --accent: #b8362d; --accent-soft: #f3d9d5; --line: #e6dccd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171412; --card: #221e1a; --ink: #f1e9dd; --muted: #a2968a; --accent: #e0574c; --accent-soft: #3a2320; --line: #332c26; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { padding: 14px 18px 8px; max-width: 620px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  header a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .ttl { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
  main { max-width: 620px; margin: 0 auto; padding: 6px 18px 40px; }
  .jak { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 4px 0 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 10px; }
  h2 a { color: inherit; text-decoration: none; }
  .odc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .odc.gra { border-color: var(--accent); }
  .odc .t { font-size: 17px; font-weight: 600; }
  .odc .m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
  .opis { font-size: 14px; line-height: 1.45; margin: 0 0 10px; }
  .odc audio { width: 100%; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .dialog { display: none; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .odc.otwarty .dialog { display: block; }
  .kw { display: grid; grid-template-columns: 74px 1fr; gap: 2px 10px; padding: 6px 0; font-size: 14px; }
  .kw .kto { color: var(--muted); font-size: 12px; padding-top: 3px; }
  .kw.ty .kto { color: var(--accent); font-weight: 600; }
  .kw .hz { font-size: 19px; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .kw .py { color: var(--muted); font-size: 13px; }
  .nowe { margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .nowe b { color: var(--ink); }
</style>
</head>
<body>
<header><a href="../">← lekcje</a><div class="ttl">🎭 Scenki</div><a href="../podcast/">podcast</a></header>
<main>
  <div class="jak">Krótkie rozmowy z tego, co już znasz. Odcinek: o czym jest, cała rozmowa, potem zdanie po zdaniu (polski, chiński wolno, pauza, chiński, pauza), na końcu grasz swoją rolę: po polskiej podpowiedzi mówisz po chińsku.</div>
  <div id="lista"></div>
</main>
<script>
const LEKCJE = [{"dir": "02-jedzenie-i-napoje", "tytul": "Lekcja 2 · Jedzenie i napoje", "scenki": [{"id": "restauracja", "tytul": "W restauracji", "opis": "Kubi zamawia u kelnerki jedzenie i coś do picia, a potem mówi, czy smakowało.", "role": {"A": "Kelnerka", "B": "Kubi"}, "ty": "B", "kwestie": [{"kto": "A", "znaki": "你好！你想吃什么？", "pinyin": "Nǐ hǎo! Nǐ xiǎng chī shénme?", "polski": "Dzień dobry! Co chcesz zjeść?"}, {"kto": "B", "znaki": "我想吃饺子和鸡肉。", "pinyin": "Wǒ xiǎng chī jiǎozi hé jīròu.", "polski": "Chcę zjeść pierogi i kurczaka."}, {"kto": "A", "znaki": "好。你想喝什么？", "pinyin": "Hǎo. Nǐ xiǎng hē shénme?", "polski": "Dobrze. Czego się napijesz?"}, {"kto": "B", "znaki": "我想喝茶，谢谢。", "pinyin": "Wǒ xiǎng hē chá, xièxie.", "polski": "Napiję się herbaty, dziękuję."}, {"kto": "A", "znaki": "请。饺子好吃吗？", "pinyin": "Qǐng. Jiǎozi hǎochī ma?", "polski": "Proszę. Czy pierogi są smaczne?"}, {"kto": "B", "znaki": "很好吃！我喜欢饺子。", "pinyin": "Hěn hǎochī! Wǒ xǐhuan jiǎozi.", "polski": "Bardzo smaczne! Lubię pierogi."}, {"kto": "A", "znaki": "太好了！", "pinyin": "Tài hǎo le!", "polski": "Świetnie!"}, {"kto": "B", "znaki": "多少钱？", "pinyin": "Duōshao qián?", "polski": "Ile płacę?"}], "nowe": [{"znaki": "请", "pinyin": "qǐng", "polski": "ćhing", "znaczenie": "please · proszę"}, {"znaki": "太好了！", "pinyin": "Tài hǎo le!", "polski": "thaj chał ly", "znaczenie": "Great! · Świetnie!"}, {"znaki": "多少钱？", "pinyin": "Duōshao qián?", "polski": "tło-szał ćhien", "znaczenie": "How much? · Ile to kosztuje?"}], "podcast": {"plik": "scenka-restauracja.mp3", "sekund": 235, "n": 8}}, {"id": "kawa-z-kolezanka", "tytul": "Kawa z koleżanką", "opis": "Kubi i Li Mei ustalają, czego się napiją. Kubi woli piwo i pizzę, ona matchę.", "role": {"A": "Li Mei", "B": "Kubi"}, "ty": "B", "kwestie": [{"kto": "A", "znaki": "你想喝咖啡吗？", "pinyin": "Nǐ xiǎng hē kāfēi ma?", "polski": "Chcesz się napić kawy?"}, {"kto": "B", "znaki": "不，我想喝啤酒。你呢？", "pinyin": "Bù, wǒ xiǎng hē píjiǔ. Nǐ ne?", "polski": "Nie, chcę się napić piwa. A ty?"}, {"kto": "A", "znaki": "我想喝抹茶。你想吃什么？", "pinyin": "Wǒ xiǎng hē mǒchá. Nǐ xiǎng chī shénme?", "polski": "Ja napiję się matchy. Co chcesz zjeść?"}, {"kto": "B", "znaki": "我喜欢披萨和汉堡。", "pinyin": "Wǒ xǐhuan pīsà hé hànbǎo.", "polski": "Lubię pizzę i hamburgery."}, {"kto": "A", "znaki": "披萨好吃，汉堡难吃。", "pinyin": "Pīsà hǎochī, hànbǎo nánchī.", "polski": "Pizza jest smaczna, hamburger niedobry."}, {"kto": "B", "znaki": "我不明白。汉堡很好吃！", "pinyin": "Wǒ bù míngbai. Hànbǎo hěn hǎochī!", "polski": "Nie rozumiem. Hamburger jest bardzo smaczny!"}, {"kto": "A", "znaki": "好，好。", "pinyin": "Hǎo, hǎo.", "polski": "Dobrze, dobrze."}, {"kto": "B", "znaki": "你很可爱。我们明天见？", "pinyin": "Nǐ hěn kě'ài. Wǒmen míngtiān jiàn?", "polski": "Jesteś słodka. Spotkamy się jutro?"}, {"kto": "A", "znaki": "好，明天见！", "pinyin": "Hǎo, míngtiān jiàn!", "polski": "Dobrze, do jutra!"}], "nowe": [], "podcast": {"plik": "scenka-kawa-z-kolezanka.mp3", "sekund": 298, "n": 9}}]}, {"dir": "01-przyjaciele", "tytul": "Lekcja 1 · Przyjaciele", "scenki": [{"id": "nowa-znajoma", "tytul": "Nowa znajoma", "opis": "Kubi poznaje na imprezie dziewczynę. Pytają się o imię i skąd są, Kubi mówi jej komplement.", "role": {"A": "Li Mei", "B": "Kubi"}, "ty": "B", "kwestie": [{"kto": "A", "znaki": "你好吗？", "pinyin": "Nǐ hǎo ma?", "polski": "Jak się masz?"}, {"kto": "B", "znaki": "很好，谢谢。你叫什么名字？", "pinyin": "Hěn hǎo, xièxie. Nǐ jiào shénme míngzi?", "polski": "Dobrze, dziękuję. Jak masz na imię?"}, {"kto": "A", "znaki": "我叫李美。你呢？", "pinyin": "Wǒ jiào Lǐ Měi. Nǐ ne?", "polski": "Mam na imię Li Mei. A ty?"}, {"kto": "B", "znaki": "我叫Kubi。你来自哪里？", "pinyin": "Wǒ jiào Kubi. Nǐ láizì nǎlǐ?", "polski": "Jestem Kubi. Skąd jesteś?"}, {"kto": "A", "znaki": "我来自北京。你呢？", "pinyin": "Wǒ láizì Běijīng. Nǐ ne?", "polski": "Jestem z Pekinu. A ty?"}, {"kto": "B", "znaki": "我来自波兰。你很美丽。", "pinyin": "Wǒ láizì Bōlán. Nǐ hěn měilì.", "polski": "Jestem z Polski. Jesteś bardzo piękna."}, {"kto": "A", "znaki": "谢谢！你很可爱。", "pinyin": "Xièxie! Nǐ hěn kě'ài.", "polski": "Dziękuję! Jesteś słodki."}, {"kto": "B", "znaki": "我们明天见？", "pinyin": "Wǒmen míngtiān jiàn?", "polski": "Spotkamy się jutro?"}, {"kto": "A", "znaki": "好，明天见！", "pinyin": "Hǎo, míngtiān jiàn!", "polski": "Dobrze, do jutra!"}], "nowe": [{"znaki": "谢谢", "pinyin": "xièxie", "polski": "sie-sie", "znaczenie": "thank you · dziękuję"}, {"znaki": "你呢？", "pinyin": "Nǐ ne?", "polski": "ni ny", "znaczenie": "And you? · A ty?"}, {"znaki": "北京", "pinyin": "Běijīng", "polski": "pej-dzing", "znaczenie": "Beijing · Pekin"}, {"znaki": "李美", "pinyin": "Lǐ Měi", "polski": "li mej", "znaczenie": "Li Mei (name) · Li Mei (imię)"}], "podcast": {"plik": "scenka-nowa-znajoma.mp3", "sekund": 273, "n": 9}}]}];
const $lista = document.getElementById("lista");
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const tempo = Number(ls.get("kubus.podcast.tempo") || 1);
let grajacy = null;

for (const l of LEKCJE) {
  const h = document.createElement("h2"); h.id = l.dir; h.innerHTML = `<a href="../lekcje/${l.dir}/">${l.tytul}</a>`; $lista.appendChild(h);
  for (const sc of l.scenki) {
    const el = document.createElement("div"); el.className = "odc"; el.id = l.dir + "-" + sc.id;
    el.innerHTML = `<div class="t">${sc.tytul}</div><div class="m">${sc.podcast ? fmt(sc.podcast.sekund) + " · " : ""}${sc.kwestie.length} kwestii · ty jesteś <b>${sc.role[sc.ty] || sc.ty}</b></div>
      <div class="opis">${sc.opis}</div>
      ${sc.podcast ? `<audio controls preload="none" src="../lekcje/${l.dir}/${sc.podcast.plik}?v=${sc.podcast.sekund}"></audio>` : ""}
      <div class="row"><span style="font-size:12px;color:var(--muted)">tempo</span>
        ${[0.8, 1, 1.2].map(t => `<button data-tempo="${t}" class="${t === tempo ? "on" : ""}">${t}×</button>`).join("")}
        <button class="dlg">dialog</button></div>
      <div class="dialog">${sc.kwestie.map(k => `<div class="kw${k.kto === sc.ty ? " ty" : ""}"><div class="kto">${sc.role[k.kto] || k.kto}</div><div><div class="hz">${k.znaki}</div><div class="py">${k.pinyin}</div><div>${k.polski}</div></div></div>`).join("")}
        ${sc.nowe.length ? `<div class="nowe">Słowa dodane do lekcji przez tę scenkę: ${sc.nowe.map(n => `<b>${n.znaki}</b> ${n.pinyin} · ${n.znaczenie.split("·").pop().trim()}`).join(" · ")}</div>` : ""}</div>`;
    el.querySelector(".dlg").addEventListener("click", () => el.classList.toggle("otwarty"));
    const a = el.querySelector("audio");
    if (a) {
      a.playbackRate = tempo;
      a.addEventListener("play", () => {
        if (grajacy && grajacy !== a) grajacy.pause();
        grajacy = a; document.querySelectorAll(".odc").forEach(x => x.classList.toggle("gra", x === el));
        a.playbackRate = Number(ls.get("kubus.podcast.tempo") || 1);
        if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: sc.tytul, artist: l.tytul, album: "Scenki" });
      });
      a.addEventListener("error", () => { el.querySelector(".m").textContent = "Nagranie nie wczytało się. Odśwież stronę."; });
    }
    el.querySelectorAll("[data-tempo]").forEach(b => b.addEventListener("click", () => {
      const t = Number(b.dataset.tempo); ls.set("kubus.podcast.tempo", String(t));
      document.querySelectorAll("[data-tempo]").forEach(x => x.classList.toggle("on", Number(x.dataset.tempo) === t));
      document.querySelectorAll("audio").forEach(x => x.playbackRate = t);
    }));
    $lista.appendChild(el);
  }
}
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
